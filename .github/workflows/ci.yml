name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required by Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # xunit.v3 runs on Microsoft Testing Platform, not VSTest, so the VSTest-only
      # --collect:"XPlat Code Coverage" is not understood here: it reports "Zero tests ran"
      # and exits 5. Coverage comes from Microsoft.Testing.Extensions.CodeCoverage instead.
      - name: Test with coverage
        run: >
          dotnet test
          --no-build
          --configuration Release
          --coverage
          --coverage-output-format cobertura
          --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./coverage

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Login to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: david_n_m_bond

      - name: Push package to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Test coverage, uploaded to Codacy (OPS-157454).
  #
  # pdl-public, never a GitHub-hosted runner. This repository is public, and pdl-public is the
  # hardened scale set that may serve one: no dind, no privileged container, no hostPath.
  coverage:
    runs-on: [pdl-public]

    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: the actions-runner image our scale sets use does not offer
    # the Node version several of these actions request by default, and without it they fail before
    # their first step runs.
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        # The runner user cannot write the default /usr/share/dotnet, so install the SDK somewhere
        # it can. setup-dotnet puts this directory on PATH for the later steps.
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: '10.0.x'

    - name: Build tests
      run: dotnet build Maschine.Api.Test/Maschine.Api.Test.csproj --configuration Debug

    # The test project is an xunit v3 Microsoft.Testing.Platform application, so coverage is
    # collected by running it directly (Microsoft.Testing.Extensions.CodeCoverage) rather than
    # through "dotnet test". On Linux the executable has no ".exe" extension. The report is written
    # to bin/Debug/net10.0/TestResults/coverage.cobertura.xml.
    #
    # CI runs every test: the Maschine.Api tests are hardware-free unit tests that need no device and
    # no credentials, so no filter is applied.
    - name: Run tests with coverage
      working-directory: Maschine.Api.Test/bin/Debug/net10.0
      run: >-
        ./Maschine.Api.Test
        --coverage
        --coverage-settings "$GITHUB_WORKSPACE/coverage.config"
        --coverage-output-format cobertura
        --coverage-output coverage.cobertura.xml

    # continue-on-error: a Codacy outage must not turn a passing test run red. The trade-off is that
    # an expired project token fails silently, so check the log for "Coverage received successfully".
    - name: Upload coverage to Codacy
      continue-on-error: true
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: Maschine.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml

    - name: Upload coverage artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: Maschine.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml
        retention-days: 7
